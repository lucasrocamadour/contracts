[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contracts"
version = "0.1.0"
description = "Puerto Rico public-contract data pipeline and interactive analysis dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.134,<1",
  "pyarrow>=23,<24",
  "requests>=2.32,<3",
  "uvicorn>=0.41,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
contracts-pipeline = "contracts.a_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contracts = ["fix.json", "static/*.html", "static/*.css", "static/*.js", "static/modules/*.js"]
